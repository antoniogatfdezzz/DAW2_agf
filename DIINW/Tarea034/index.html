<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Tarea034</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="style.css">
	</head>
	<body class="p-3">
		<div class="container">
			<div class="mb-3 controls">
				<div class="btn-group" role="group" aria-label="Traer arriba">
					<label class="btn btn-outline-primary" for="top1">Traer Amarilla arriba</label>
					<label class="btn btn-outline-primary" for="top2">Traer Roja arriba</label>
				</div>
			</div>


			<input type="radio" name="top" id="top1">
			<input type="radio" name="top" id="top2" checked>
			<div class="board" aria-hidden="false">
				<div class="cell" data-pos="1"></div>
				<div class="cell" data-pos="2"></div>
				<div class="cell" data-pos="3"></div>
				<div class="cell" data-pos="4"></div>

				<div class="cell" data-pos="5"></div>
				<div class="cell" data-pos="6"></div>
				<div class="cell" data-pos="7"></div>
				<div class="cell" data-pos="8"></div>

				<div class="cell" data-pos="9"></div>
				<div class="cell" data-pos="10"></div>
				<div class="cell" data-pos="11"></div>
				<div class="cell" data-pos="12"></div>

				<div class="cell" data-pos="13"></div>
				<div class="cell" data-pos="14"></div>
				<div class="cell" data-pos="15"></div>
				<div class="cell" data-pos="16"></div>

				<img class="img img1" alt="Amarilla" src="data:image/svg+xml;utf8,<?xml version='1.0' encoding='utf-8'?><svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%25' height='100%25' fill='%23ffff00'/></svg>">
				<img class="img img2" alt="Naranja" src="data:image/svg+xml;utf8,<?xml version='1.0' encoding='utf-8'?><svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%25' height='100%25' fill='%23ff4500'/></svg>">
			</div>

		</div>
	</body>
</html>
