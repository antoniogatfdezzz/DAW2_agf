<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bootstrap</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="bootstrap.css">
</head>
<body>
  <div class="login-wrapper d-flex justify-content-center align-items-center">
    <div class="d-flex flex-column align-items-center" style="width: 380px;">
      <div class="avatar-circle">
        <img src="imagenes/image.png" alt="Avatar" class="avatar-img" />
      </div>
      <div class="card login-card w-100">
        <div class="card-body px-4 pb-4">
          <form novalidate>
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="email" class="form-control" placeholder="Usuario" autocomplete="username" />
            </div>
            <div class="mb-4 position-relative">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="Contraseña" autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-entrar text-white w-100">Entrar</button>
          </form>
          <div class="text-center mt-3">
            <a href="#" class="forgot-link">¿Has olvidado tu contraseña?</a>
          </div>
          <div class="text-center mt-3">
            <button class="btn btn-google d-inline-flex align-items-center gap-2">
              <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Inicia sesión con Google
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script>
    (function () {
      var contador = 0;
      var imagenes = [
        "imagenes/fondo1.jpg",
        "imagenes/fondo2.jpg",
        "imagenes/fondo3.jpg"
      ];

      function cambiafondo() {
        document.body.style.backgroundImage = "url('" + imagenes[contador] + "')";
        contador = (contador + 1) % imagenes.length;
      }

      cambiafondo();
      setInterval(cambiafondo, 6000);
    })();
  </script>
</body>
</html>
