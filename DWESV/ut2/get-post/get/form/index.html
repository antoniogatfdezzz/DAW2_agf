<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="form.php" method="GET">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="ciudad">Ciudad:</label>
        <select id="ciudad" name="ciudad" required>
            <option value="caceres">Caceres</option>
            <option value="badajoz">Badajoz</option>
            <option value="ribera">Ribera del Fresno</option>
        </select>

        <label>Animales:</label>
        <input type="checkbox" name="animal[]" value="Perro"> Perro
        <input type="checkbox" name="animal[]" value="Gato"> Gato
        <input type="checkbox" name="animal[]" value="Pájaro"> Pájaro
        <input type="checkbox" name="animal[]" value="Conejo"> Conejo

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
