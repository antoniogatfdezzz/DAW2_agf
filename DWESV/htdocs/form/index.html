<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario PHP</title>

</head>
<body>
    <h1>Formulario</h1>
    <form action="form.php" method="POST" enctype="multipart/form-data">
        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required>
        </div>
        <div>
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
        </div>
        <div>
            <label for="documento_txt">Documento .txt</label>
            <input id="documento_txt" name="documento_txt" type="file" accept=".txt,text/plain" required>
        </div>
        <div>
            <label for="imagen">Imagen (.jpg, .png, .gif)</label>
            <input id="imagen" name="imagen" type="file" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif" required>
        </div>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
