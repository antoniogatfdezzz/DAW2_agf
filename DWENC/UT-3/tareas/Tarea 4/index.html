<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antonio Gat Fernández</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" ></script>

</head>

<body>



    <div class="main-content">


  <article class="about active game-card" data-page="home">

        <header>
          <h2 class="h2 article-title">Tres en Raya</h2>
        </header>

        <div class="scoreboard">
          <div class="score">
            <span class="label">X</span>
            <span id="score-x" class="value">0</span>
          </div>
          <div class="score">
            <span class="label">O</span>
            <span id="score-o" class="value">0</span>
          </div>
        </div>

        <div class="status-card">
          <p class="status"></p>
        </div>

        <div class="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>
        <div class="controls">
          <button class="restart-btn">Reiniciar</button>
        </div>
        
      </article>
      
      
    </div>
    
  </main>

  <script src="script.js"></script>

</body>

</html>
