<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Formulario de Registro de Cliente</h1>
        
        <form id="formularioCliente" novalidate>
            <fieldset>
                <legend>Datos Personales</legend>
                
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" 
                           data-validacion="obligatorio"
                           data-ayuda="Introduce tu nombre completo">
                </div>
                
                <div class="campo">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" 
                           data-validacion="obligatorio"
                           data-ayuda="Introduce tus apellidos completos">
                </div>
                
                <div class="campo">
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" name="dni" 
                           data-validacion="dni"
                           data-ayuda="Introduce tu DNI con el formato 12345678A">
                </div>
            </fieldset>
            
            <fieldset>
                <legend>Cuenta</legend>
                
                <div class="campo">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" 
                           data-validacion="email"
                           data-ayuda="Introduce una dirección de email válida">
                </div>
                
                <div class="campo">
                    <label for="password1">Contraseña:</label>
                    <input type="password" id="password1" name="password1" 
                           data-validacion="password"
                           data-ayuda="Introduce una contraseña segura">
                </div>
                
                <div class="campo">
                    <label for="password2">Repetir Contraseña:</label>
                    <input type="password" id="password2" name="password2" 
                           data-validacion="password-confirm"
                           data-ayuda="Repite la misma contraseña anterior">
                </div>
            </fieldset>
            
            <div class="botones">
                <button type="submit">Aceptar</button>
                <button type="button" id="limpiar">Limpiar</button>
            </div>
        </form>
        
        <div id="mensajes">
            <p id="mensaje-contenido"></p>
        </div>
    </div>

    <script type="module" src="formulario.mjs"></script>
</body>
</html>
