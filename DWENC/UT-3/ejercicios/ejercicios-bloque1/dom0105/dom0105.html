<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>dom0105</title>
	<link rel="stylesheet" href="dom0105.css">
</head>
<body>
	<h1>Tabla de Frutas</h1>
	<table id="tablaFrutas">
		<thead>
			<tr>
				<th>Fruta</th>
				<th>Color</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>Manzana</td>
				<td>Rojo</td>
			</tr>
			<tr>
				<td>Plátano</td>
				<td>Amarillo</td>
			</tr>
			<tr>
				<td>Kiwi</td>
				<td>Verde</td>
			</tr>
		</tbody>
	</table>
	<div class="formulario">
		<input type="text" id="inputFruta" placeholder="Nombre de la fruta">
		<input type="text" id="inputColor" placeholder="Color">
		<button id="btnAgregar">Agregar fruta</button>
	</div>
	<script src="dom0105.js"></script>
</body>
</html>
