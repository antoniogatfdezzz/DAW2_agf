<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>dom0101 Colores</title>
		<link rel="stylesheet" href="./dom0101.css" />
		<script src="./dom0101.js" defer></script>
	</head>
	<body>
		<main class="container">
			<h1>Colores</h1>
			<p>
				Pulsa un botón para poner el campo de texto del mismo color.
			</p>

			<div class="controls">
				<button id="btnRojo" class="btn rojo" type="button">Rojo</button>
				<button id="btnAzul" class="btn azul" type="button">Azul</button>
				<button id="btnVerde" class="btn verde" type="button">Verde</button>
			</div>

			<label for="campo" class="campo-label">Campo de texto</label>
			<input id="campo" class="campo" type="text" placeholder="El color cambiará aquí" />
		</main>
	</body>
	</html>
