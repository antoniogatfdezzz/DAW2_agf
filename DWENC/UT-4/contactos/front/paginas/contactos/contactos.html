<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Hojas de estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dependencias JavaScript-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
			integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
			crossorigin="anonymous" defer>
    </script>

    <!-- Dependencias relacionadas con bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json2html/3.3.3/json2html.min.js" integrity="sha512-DUVk2fytf8RdJGo1naKJue1sYTrezdc11yQLGOR+eSlDPL53RPKwwBKOsnBjSrcTYIEqeXKWw7T5hQUkTbbXdQ==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>

    <!-- Carga los parámetros de configuración -->
    <script src="../../js/enviroment.js" defer></script>

    <script type="module" src="contactos.mjs"></script>
</head>
<body>

    <div>
        <div class="container my-3">
            <div class="row mb-2">
                <div class="col-12 col-md-6 d-flex gap-2">
                    <input id="buscarContacto" class="form-control" type="search" placeholder="Buscar contactos por nombre, descripción o empresa..." aria-label="Buscar contactos">
                    <button id="btBuscarContacto" class="btn btn-primary" type="button"><i class="bi bi-search"></i></button>
                </div>
            </div>
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">Descripción</th>
                                    <th scope="col">Empresa</th>
                                    <th scope="col">Editar</th>
                                    <th scope="col">Eliminar</th>
                                </tr>
                            </thead>
                            <tbody id="contactos">
                            </tbody>
                        </table>
        </div>
    </div>
    
</body>
</html>
