{% extends "base.html" %}

{% block title %}Añadir Película - CineFlask{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">
                    <i class="fas fa-plus-circle me-2"></i>Añadir Nueva Película
                </h2>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_movie') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">
                            <i class="fas fa-film me-1"></i>Título *
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="title" 
                               name="title" 
                               placeholder="Ej: El Padrino"
                               required>
                    </div>

                    <div class="mb-3">
                        <label for="director" class="form-label">
                            <i class="fas fa-user-tie me-1"></i>Director *
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="director" 
                               name="director" 
                               placeholder="Ej: Francis Ford Coppola"
                               required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="year" class="form-label">
                                <i class="fas fa-calendar me-1"></i>Año *
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="year" 
                                   name="year" 
                                   min="1888" 
                                   max="2099" 
                                   placeholder="Ej: 1994"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="genre" class="form-label">
                                <i class="fas fa-masks-theater me-1"></i>Género *
                            </label>
                            <select class="form-select" id="genre" name="genre" required>
                                <option value="">Selecciona un género</option>
                                <option value="Acción">Acción</option>
                                <option value="Aventura">Aventura</option>
                                <option value="Comedia">Comedia</option>
                                <option value="Drama">Drama</option>
                                <option value="Terror">Terror</option>
                                <option value="Ciencia Ficción">Ciencia Ficción</option>
                                <option value="Romance">Romance</option>
                                <option value="Thriller">Thriller</option>
                                <option value="Animación">Animación</option>
                                <option value="Documental">Documental</option>
                                <option value="Crimen">Crimen</option>
                                <option value="Fantasía">Fantasía</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="fas fa-align-left me-1"></i>Descripción *
                        </label>
                        <textarea class="form-control" 
                                  id="description" 
                                  name="description" 
                                  rows="4" 
                                  placeholder="Escribe una breve sinopsis de la película..."
                                  required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="rating" class="form-label">
                                <i class="fas fa-star me-1"></i>Valoración *
                            </label>
                            <input type="number" 
                                   class="form-control" 
                                   id="rating" 
                                   name="rating" 
                                   min="0" 
                                   max="10" 
                                   step="0.1" 
                                   placeholder="Ej: 8.5"
                                   required>
                            <div class="form-text">Valoración de 0 a 10</div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="poster_url" class="form-label">
                                <i class="fas fa-image me-1"></i>URL del Póster *
                            </label>
                            <input type="url" 
                                   class="form-control" 
                                   id="poster_url" 
                                   name="poster_url" 
                                   placeholder="https://ejemplo.com/poster.jpg"
                                   required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('movies') }}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Guardar Película
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="alert alert-info mt-3">
            <i class="fas fa-info-circle me-2"></i>
            <strong>Nota:</strong> Todos los campos marcados con * son obligatorios.
        </div>
    </div>
</div>
{% endblock %}
